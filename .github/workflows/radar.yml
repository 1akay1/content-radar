name: Content-Radar

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discovery nur in der ersten Woche des Monats
        id: modus
        run: |
          if [ "$(date -u +%d)" -le 07 ]; then
            echo "flag=--discover" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 radar.py ${{ steps.modus.outputs.flag }}

      - name: Ergebnis ablegen
        run: |
          git config user.name "content-radar"
          git config user.email "actions@users.noreply.github.com"
                   git add -A
          git diff --staged --quiet || git commit -m "Radar $(date -u +%Y-%m-%d)"
          git push
